name: Foobar CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.4'

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./cmd/foobar

    - name: Test
      run: go test -v ./internal/...
